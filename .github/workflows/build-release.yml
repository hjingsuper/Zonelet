name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_release: ${{ steps.release_check.outputs.should_release }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_NUMBER="$(tr -d '[:space:]' < BUILD_NUMBER)"
          if [[ ! "$VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid BUILD_NUMBER: $BUILD_NUMBER" >&2
            exit 1
          fi
          RELEASE_TAG="v$VERSION"
          DISTRIBUTION_BUILD=0
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            DISTRIBUTION_BUILD=1
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION ($VERSION)." >&2
              exit 1
            fi
            DISTRIBUTION_BUILD=1
          fi
          echo "ZONELET_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZONELET_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "ZONELET_DISTRIBUTION_BUILD=$DISTRIBUTION_BUILD" >> "$GITHUB_ENV"
          echo "ZONELET_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Validate release prerequisites
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ "$ZONELET_DISTRIBUTION_BUILD" != "1" ]]; then
            echo "ZONELET_CAN_SIGN_UPDATES=0" >> "$GITHUB_ENV"
            echo "ZONELET_SHOULD_RELEASE=0" >> "$GITHUB_ENV"
            echo "should_release=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$ZONELET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $ZONELET_RELEASE_TAG already exists; skipping duplicate publication."
            echo "ZONELET_CAN_SIGN_UPDATES=0" >> "$GITHUB_ENV"
            echo "ZONELET_SHOULD_RELEASE=0" >> "$GITHUB_ENV"
            echo "should_release=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "SPARKLE_ED_PRIVATE_KEY is required for a public release." >&2
            exit 1
          fi
          if gh release view --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            LATEST_APPCAST_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"
            LATEST_APPCAST="$(curl --fail --silent --show-error --location --retry 3 "$LATEST_APPCAST_URL")"
            LATEST_BUILD="$(python3 -c 'import sys, xml.etree.ElementTree as ET; root = ET.fromstring(sys.stdin.read()); print(next(((node.text or "").strip() for node in root.iter() if node.tag.rsplit("}", 1)[-1] == "version"), ""))' <<< "$LATEST_APPCAST")"
            if [[ ! "$LATEST_BUILD" =~ ^[1-9][0-9]*$ ]]; then
              echo "The published appcast does not contain a valid Sparkle build number." >&2
              exit 1
            fi
            if [[ "$ZONELET_BUILD_NUMBER" -le "$LATEST_BUILD" ]]; then
              echo "BUILD_NUMBER must be greater than the published build ($LATEST_BUILD)." >&2
              exit 1
            fi
          fi
          echo "ZONELET_CAN_SIGN_UPDATES=1" >> "$GITHUB_ENV"
          echo "ZONELET_SHOULD_RELEASE=1" >> "$GITHUB_ENV"
          echo "should_release=1" >> "$GITHUB_OUTPUT"
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ZONELET_CONFIGURATION=release ./script/build_and_run.sh --package
      - name: Verify Apple Silicon build
        run: |
          test "$(uname -m)" = "arm64"
          test "$(lipo -archs dist/Zonelet.app/Contents/MacOS/Zonelet)" = "arm64"
          codesign --verify --deep --strict --verbose=2 dist/Zonelet.app
          open -n dist/Zonelet.app
          sleep 3
          pgrep -x Zonelet
          pkill -x Zonelet
      - name: Set up Python for DMG packaging
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create DMG
        run: |
          python3 -m pip install --disable-pip-version-check dmgbuild==1.6.5
          bash ./script/package_dmg.sh dist/Zonelet.app Zonelet-Apple-Silicon.dmg
      - name: Verify DMG and create checksum
        run: |
          hdiutil verify Zonelet-Apple-Silicon.dmg
          shasum -a 256 Zonelet-Apple-Silicon.dmg > Zonelet-Apple-Silicon.dmg.sha256
      - name: Generate signed Sparkle appcast
        if: env.ZONELET_SHOULD_RELEASE == '1' && env.ZONELET_CAN_SIGN_UPDATES == '1'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          APPCAST_DIR="$RUNNER_TEMP/zonelet-appcast"
          mkdir -p "$APPCAST_DIR"
          cp Zonelet-Apple-Silicon.dmg "$APPCAST_DIR/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$ZONELET_RELEASE_TAG/" \
              --link "https://hjingsuper.github.io/Zonelet/" \
              -o "$GITHUB_WORKSPACE/appcast.xml" \
              "$APPCAST_DIR"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zonelet-Apple-Silicon-${{ github.sha }}
          path: |
            Zonelet-Apple-Silicon.dmg
            Zonelet-Apple-Silicon.dmg.sha256
            appcast.xml
          retention-days: 14

  release:
    if: needs.build.outputs.should_release == '1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download packaged app
        uses: actions/download-artifact@v5
        with:
          name: Zonelet-Apple-Silicon-${{ github.sha }}
          path: release
      - name: Publish GitHub Release
        run: |
          ASSETS=(
            release/Zonelet-Apple-Silicon.dmg
            release/Zonelet-Apple-Silicon.dmg.sha256
            release/appcast.xml
          )
          test -f release/appcast.xml
          RELEASE_TAG="${{ needs.build.outputs.release_tag }}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Zonelet $RELEASE_TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ZONELET_CONFIGURATION=release ./script/build_and_run.sh --package
      - name: Verify Apple Silicon build
        run: |
          test "$(uname -m)" = "arm64"
          test "$(lipo -archs dist/Zonelet.app/Contents/MacOS/Zonelet)" = "arm64"
          codesign --verify --deep --strict --verbose=2 dist/Zonelet.app
      - name: Create DMG and checksum
        run: |
          bash ./script/package_dmg.sh dist/Zonelet.app Zonelet-Apple-Silicon.dmg
          hdiutil verify Zonelet-Apple-Silicon.dmg
          shasum -a 256 Zonelet-Apple-Silicon.dmg > Zonelet-Apple-Silicon.dmg.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zonelet-Apple-Silicon-${{ github.sha }}
          path: |
            Zonelet-Apple-Silicon.dmg
            Zonelet-Apple-Silicon.dmg.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v5
        with:
          name: Zonelet-Apple-Silicon-${{ github.sha }}
          path: release
      - name: Publish GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/Zonelet-Apple-Silicon.dmg \
              release/Zonelet-Apple-Silicon.dmg.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/Zonelet-Apple-Silicon.dmg \
              release/Zonelet-Apple-Silicon.dmg.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Zonelet $GITHUB_REF_NAME" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

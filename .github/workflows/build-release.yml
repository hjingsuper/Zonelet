name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ZONELET_CONFIGURATION=release ./script/build_and_run.sh --package
      - name: Create archive and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Zonelet.app Zonelet-macOS.zip
          shasum -a 256 Zonelet-macOS.zip > Zonelet-macOS.zip.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zonelet-macOS-${{ github.sha }}
          path: |
            Zonelet-macOS.zip
            Zonelet-macOS.zip.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v5
        with:
          name: Zonelet-macOS-${{ github.sha }}
          path: release
      - name: Publish GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/Zonelet-macOS.zip \
              release/Zonelet-macOS.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/Zonelet-macOS.zip \
              release/Zonelet-macOS.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Zonelet $GITHUB_REF_NAME" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
